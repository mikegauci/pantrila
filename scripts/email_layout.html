<!-- Layout for scripts/email_templates.py; $names are filled in there. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>$subject</title>
</head>
<body style="margin:0;padding:0;background:$background;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">$preheader</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:$background;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
<tr><td style="padding:0 4px 20px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="vertical-align:middle;"><img src="$logo" width="40" height="40" alt="" style="display:block;border:0;border-radius:10px;"></td>
<td style="vertical-align:middle;padding-left:10px;font-family:$font;font-size:20px;font-weight:700;color:$foreground;letter-spacing:-0.3px;">Pantrila</td>
</tr></table>
</td></tr>
<tr><td style="background:$surface;border:1px solid $border;border-radius:16px;padding:32px 28px;">
<h1 style="margin:0 0 12px;font-family:$font;font-size:24px;line-height:30px;font-weight:800;color:$foreground;">$heading</h1>
<p style="margin:0 0 24px;font-family:$font;font-size:15px;line-height:24px;color:$muted;">$body</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="border-radius:12px;background:$primary;">
<a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;font-family:$font;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:12px;">$button</a>
</td></tr></table>
<p style="margin:24px 0 0;padding:12px 14px;background:$soft;border-radius:10px;font-family:$font;font-size:13px;line-height:20px;color:$primary_text;">The link works once and expires in an hour.</p>
<p style="margin:20px 0 0;font-family:$font;font-size:12px;line-height:18px;color:$muted;">Button not working? Paste this into your browser:<br><a href="{{ .ConfirmationURL }}" style="color:$primary_text;word-break:break-all;">{{ .ConfirmationURL }}</a></p>
</td></tr>
<tr><td style="padding:20px 4px 0;font-family:$font;font-size:12px;line-height:18px;color:$muted;">
You got this email because $reason. If that wasn't you, ignore it; nothing changes.<br><br>
<a href="https://pantrila.com" style="color:$muted;">pantrila.com</a> &middot; <a href="https://pantrila.com/privacy" style="color:$muted;">Privacy</a> &middot; <a href="mailto:hello@pantrila.com" style="color:$muted;">hello@pantrila.com</a>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
