services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pantrio
      POSTGRES_PASSWORD: pantrio
      POSTGRES_DB: pantrio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantrio"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
