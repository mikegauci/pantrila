# Render Blueprint for the Pantrila API (FastAPI). New > Blueprint in the Render dashboard,
# pick this repo, then fill in the secrets marked sync: false.
services:
  - type: web
    name: pantrila-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: .venv/bin/uvicorn pantrila.api:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL # Supabase session pooler URL
        sync: false
      - key: SUPABASE_URL
        value: https://tlnigvzkselebbtetibt.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY # cookbook photos in Storage; deletes accounts
        sync: false
      - key: PANTRILA_CORS_ORIGINS # web origins, comma separated: https://app.pantrila.com,https://pantrila.vercel.app
        sync: false
      - key: PANTRILA_MODEL
        value: gpt-5.4-mini
      - key: PANTRILA_PRICE_INPUT_PER_MTOK
        value: "0.75"
      - key: PANTRILA_PRICE_OUTPUT_PER_MTOK
        value: "4.50"
      - key: PANTRILA_PRICE_EMBED_PER_MTOK
        value: "0.02"
      - key: PANTRILA_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: PANTRILA_PRICE_TRANSCRIBE_PER_MIN
        value: "0.003"
      - key: PANTRILA_MEDIA_SOURCE
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: SENTRY_DSN # error reports (Sentry, EU); unset turns them off
        sync: false
      - key: POSTHOG_API_KEY # funnel analytics (PostHog EU); unset turns them off
        sync: false
      - key: POSTHOG_PERSONAL_API_KEY # person:write, so account deletion removes the person
        sync: false
      - key: POSTHOG_PROJECT_ID
        sync: false
      - key: PANTRILA_MEDIA_PLATFORMS
        sync: false
      - key: PANTRILA_IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: PANTRILA_PRICE_IMAGE_INPUT_PER_MTOK
        value: "5"
      - key: PANTRILA_PRICE_IMAGE_OUTPUT_PER_MTOK
        value: "30"
      - key: PANTRILA_DAILY_PLANS
        value: "5"
      - key: PANTRILA_DAILY_CHATS
        value: "50"
      - key: PANTRILA_DAILY_IMPORTS
        value: "20"
      - key: PANTRILA_DAILY_PHOTOS
        value: "5"
      - key: PANTRILA_DAILY_BUDGET_USD
        value: "2"
      - key: PANTRILA_DAILY_ESTIMATES
        value: "20"
      - key: PANTRILA_FREE_PLANS # Free's caps; Pro's are PANTRILA_DAILY_*
        value: "1"
      - key: PANTRILA_FREE_PLANS_WINDOW
        value: week
      - key: PANTRILA_FREE_IMPORTS
        value: "5"
      - key: PANTRILA_FREE_IMPORTS_WINDOW
        value: month
      - key: PANTRILA_FREE_CHATS
        value: "10"
      - key: PANTRILA_FREE_PHOTOS
        value: "0"
      - key: PANTRILA_PRO_USERS # owner and App Review accounts, comma separated
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET # same value as the webhook's Authorization header
        sync: false
      - key: REVENUECAT_API_KEY # secret REST API key (v1)
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_ENDPOINT
        value: https://eu.api.smith.langchain.com
      - key: LANGSMITH_PROJECT
        value: pantrila
      - key: LANGSMITH_TRACING
        value: "true"
