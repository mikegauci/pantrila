name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which side changed: a Python-only change skips the web job and the other way round.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - "src/**"
              - "tests/**"
              - "evals/**"
              - "data/**"
              - "scripts/**"
              - "supabase/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - ".github/workflows/ci.yml"
            site:
              - "site/**"
              - ".github/workflows/ci.yml"

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pantrila
          POSTGRES_PASSWORD: pantrila
          POSTGRES_DB: pantrila_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pantrila"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PANTRILA_TEST_DATABASE_URL: postgresql://pantrila:pantrila@localhost:5432/pantrila_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://tlnigvzkselebbtetibt.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Playwright's server builds the app (with the test API settings), so that build is also
      # the build check; no separate `npm run build`.
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**') }}
          restore-keys: next-${{ hashFiles('web/package-lock.json') }}-
      # Tests run in the Google Chrome that ships with the runner image, so there is no browser
      # download and no apt install of its libraries (that step took 5-10 minutes).
      - run: google-chrome --version
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: web/test-results/
          retention-days: 7

  # The pantrila.com landing site: static pages, so lint, types and a build are the checks.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
