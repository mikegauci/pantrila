[project]
name = "pantrila"
version = "0.1.0"
description = "AI cooking and meal-planning assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "langsmith>=0.3",
    "langgraph>=1.2.15",
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54.0",
    "pyjwt[crypto]>=2.15.1",
    "psycopg-pool>=3.3.3",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "av>=19.0.1",
    "sentry-sdk[fastapi]>=2.73.0",
    "posthog>=7.75.10",
]

[project.scripts]
pantrila = "pantrila.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantrila"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: calls paid APIs (OpenAI); run with -m live",
    "db: needs PANTRILA_TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
